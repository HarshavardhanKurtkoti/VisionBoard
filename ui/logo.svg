<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2320" />
      <stop offset="100%" stop-color="#04121a" />
    </linearGradient>

    <!-- Neon Stroke Gradient -->
    <linearGradient id="neonEmeraldCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Sign Inner Gradient -->
    <linearGradient id="signGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Tech Badge -->
  <rect x="3" y="3" width="42" height="42" rx="12" fill="url(#shieldGrad)" stroke="url(#neonEmeraldCyan)" stroke-width="2" filter="url(#logoGlow)" />

  <!-- Road Horizon Line -->
  <path d="M10 33 L21 27 L27 27 L38 33" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="2 2" />

  <!-- Signboard Post -->
  <line x1="24" y1="23" x2="24" y2="35" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />

  <!-- Signboard Floating Card (VisionBoard) -->
  <rect x="13" y="11" width="22" height="15" rx="3.5" fill="url(#signGrad)" stroke="#ffffff" stroke-width="1.4" />

  <!-- Road Sign Inner Symbol: Forward / Vision Arrow -->
  <path d="M24 14 L29 19 L26 19 L26 23 L22 23 L22 19 L19 19 Z" fill="#ffffff" />

  <!-- AI Target Reticle Corners -->
  <path d="M7 13 L7 7 L13 7" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M41 13 L41 7 L35 7" stroke="#06b6d4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M7 35 L7 41 L13 41" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M41 35 L41 41 L35 41" stroke="#06b6d4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Laser Scan Pulse Point -->
  <circle cx="36" cy="12" r="2" fill="#34d399" filter="url(#logoGlow)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
