# VisionBoard YOLOv8 Dataset Configuration
path: VisionBoard_Data  # dataset root dir (can be relative to execution root or absolute)
train: train/images     # train images (relative to 'path')
val: valid/images       # validation images (relative to 'path')
test: test/images       # test images (relative to 'path')

# Classes
nc: 1                   # number of classes
names: ['signboard']    # class names

# Optional configurations
single_cls: true        # single class mode
rect: false             # rectangular training
save: true              # save train/validation statistics
save_period: 10         # save checkpoint every X epochs
cache: false            # cache images for faster training
